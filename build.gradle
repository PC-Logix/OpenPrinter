// ============================
// OpenPrinter (MC 1.12.x)
// Gradle wrapper: 4.9–4.10.3
// JDK: 8 only
// ============================

// ---- Buildscript: modern repos (no jcenter), FG 2.3, git clone task 0.0.2
buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net" }
        mavenCentral()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT"
        // 0.0.2 is on Maven Central; 0.0.3 lives on Spring and now 401s.
        classpath "com.palominolabs.gradle.task:gradle-git-clone-task:0.0.2"
    }
}

// CurseGradle (works on Gradle 4.x)
plugins {
    id "com.matthewprenger.cursegradle" version "1.0.7"
}

apply plugin: "net.minecraftforge.gradle.forge"

// ---- Java 8 everywhere
sourceCompatibility = targetCompatibility = "1.8"
compileJava {
    sourceCompatibility = targetCompatibility = "1.8"
    options.encoding = "UTF-8"
}
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

// ---- Build number logic
def getGitRef() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine "git", "rev-parse", "--short", "HEAD"
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Throwable e) {
        return "unknown"
    }
}
if (System.getenv("PROMOTED_NUMBER") != null)
    ext.buildNumber = "${System.getenv("PROMOTED_NUMBER")}"
else if (System.getenv("BUILD_NUMBER") != null && System.getenv("BUILD_NUMBER") != 0)
    ext.buildNumber = "${System.getenv("BUILD_NUMBER")}"
else
    ext.buildNumber = "+" + getGitRef()

version = modVersion
group = modGroup
archivesBaseName = modBaseName

// ---- Project repos (no jcenter; https everywhere)
repositories {
    maven { url = "https://maven.cil.li/" }              // OC + RTFM
    maven { url = "https://maven.minecraftforge.net" }
    mavenCentral()
    maven {
        name = "CurseForge"
        url  = "https://minecraft.curseforge.com/api/maven/"
    }
}

// ---- Deps
dependencies {
    deobfCompile "li.cil.oc:OpenComputers:${opencomputers_version}"
    compileOnly  "li.cil.manual:RTFM:${rtfmVersion}"
}

// ---- ForgeGradle config
minecraft {
    version   = "${minecraft_version}-${forge_version}"
    runDir    = "run"
    mappings  = mcp_version
    useDepAts = true
    replace "@VERSION@", project.version
    replace "@BUILD@",   project.ext.buildNumber
}

version = "${version}.${project.ext.buildNumber}"

// ---- External sources folder
sourceSets.main.java.srcDir("./src/externs/java")

// Clean stale extern class outputs prior to jar
jar.doFirst {
    for (String s : new File("./src/externs/java").list())
        delete new File(sourceSets.main.output.classesDir, s)
}

// ---- CurseForge (as-is)
if (project.hasProperty("openprinter_curseforge_key")) {
    curseforge_key  = project.openprinter_curseforge_key
    curse_changlog  = project.changelog
}
curseforge {
    apiKey = curseforge_key
    project {
        id          = curseforge_id
        releaseType = "release"
        changelog   = curse_changlog
    }
}

// ---- Resources (mcmod.info injection)
processResources {
    inputs.property "version",   project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version + "-" + project.buildNumber,
               "mcversion": project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

// ---- IntelliJ helper
idea {
    module {
        outputDir = file("build/classes/main")
    }
}

// ---- Wiki sync (compatible with 0.0.2)
// Note: 0.0.2 has 'treeish' but NO 'forceFetch'. We delete the dir first,
// so every build clones fresh anyway.
task flushWiki(type: Delete) {
    delete "src/main/resources/assets/openprinter/doc"
}

task syncGitWiki(type: com.palominolabs.gradle.task.git.clone.GitCloneTask) {
    dir     = file("src/main/resources/assets/openprinter/doc")
    uri     = "https://github.com/PC-Logix/OpenPrinter.wiki.git"
    treeish = "origin/master"  // branch/tag/sha; 0.0.2 supports 'treeish'
    // no 'forceFetch' in 0.0.2
}

syncGitWiki.dependsOn(flushWiki)
build.dependsOn(syncGitWiki)